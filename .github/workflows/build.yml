name: Build Windows Forms prototype

on:
  push:
    branches: [master, refactor/configurable-sql-server]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build release solution
        run: msbuild VP_Midterm_Project.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
